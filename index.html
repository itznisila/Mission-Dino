 background:#d9d9d9;box-shadow:inset -3px -2px 4px #000c}

 transition:background .3s,color .3s,border-color .3s}

 .mvis{height:auto;width:clamp(130px,32%,280px);flex-shrink:0;border-bottom:0;border-right:1px solid #ffffff14}.planet{height:auto;width:68%}}

<body>
<main id="app"></main>
<footer>NASA Space Apps Challenge 2026 · Space Mission Design Game entry · Values are simplified for learning.<br>Code written with help from an AI assistant (Claude).</footer>
<script>
// ---------- Data (simplified, based on public NASA facts; see report screen) ----------
const G = 9.81, ISP = 320, EARTH_SUN = 1361; // W/m² sunlight at Earth (NASA Planetary Fact Sheet)
const BUS = { mass: 50, w: 80 }; // wiring, thermal control, harness

const SCEN = {
  earth: { name: "Earth Watch", icon: "", diff: "Easy", irr: 1361, comms: 1, rad: 0, ops: 5, budget: 300,
    target: { sci: 55, years: 5 }, where: "Earth orbit",
    goal: "Map forests, ice and farmland from orbit to track climate change.",
    bonus: "A big volcano erupts. Scientists want images right now.",
    real: "Landsat 9 (launched 2021) flies a ~705 km sun-synchronous orbit and weighed about 2,700 kg at launch.",
    orbits: [
      { id: "sso", name: "Sun-synchronous orbit (705 km)", dv: 0.1, cap: "LEO", cov: 1, life: 8, eclipse: true, rad: 0,
        learn: "Covers the whole planet and passes each place at the same local time, so images from different days compare well. Landsat uses it." },
      { id: "leo", name: "Low equatorial orbit (400 km)", dv: 0.05, cap: "LEO", cov: 0.7, life: 3, eclipse: true, rad: 0,
        learn: "Closer means sharper images, but it never flies over the poles, and air drag pulls it down within a few years." },
      { id: "geo", name: "Geostationary orbit (35,786 km)", dv: 1.8, cap: "GEO", cov: 0.5, life: 15, eclipse: false, rad: 0.5, link: 1.5,
        learn: "Hovers over one spot: sees half the Earth all the time but from far away (less detail). Getting there needs lots of fuel, but it is always in view of the ground station." } ] },
  mars: { name: "Red Planet Mapper", icon: "", diff: "Medium", irr: 586, comms: 0.2, rad: 0.5, ops: 10, budget: 450,
    target: { sci: 60, years: 4 }, where: "Mars orbit",
    goal: "Find where water ice hides under the surface of Mars.",
    bonus: "A planet-wide dust storm is starting on Mars.",
    real: "Mars Reconnaissance Orbiter (launched 2005) weighed 2,180 kg at launch. Its HiRISE camera alone is about 65 kg.",
    orbits: [
      { id: "low", name: "Low mapping orbit (300 km)", dv: 1.4, cap: "MARS", cov: 1, life: 6, eclipse: true, rad: 0,
        learn: "A low, near-polar orbit lets cameras see small details everywhere. Braking into it takes a lot of fuel." },
      { id: "ell", name: "High elliptical orbit", dv: 0.8, cap: "MARS", cov: 0.6, life: 10, eclipse: true, rad: 0,
        learn: "Cheaper to capture into, but the spacecraft spends most of its time far from the surface, so data is less detailed." } ] },
  jupiter: { name: "Giant Planet Explorer", icon: "", diff: "Hard", irr: 50.3, comms: 0.03, rad: 3, ops: 15, budget: 650,
    target: { sci: 40, years: 4 }, where: "Jupiter orbit",
    goal: "Measure what is under Jupiter's clouds and how its magnetic field works.",
    bonus: "A huge new storm appears in Jupiter's clouds.",
    real: "Juno (launched 2011) weighed 3,625 kg. Its solar wings make about 14,000 W at Earth but only about 500 W at Jupiter, and its electronics sit in a titanium radiation vault.",
    orbits: [
      { id: "pol", name: "Polar looping orbit (Juno-style)", dv: 0.6, cap: "JUP", cov: 1, life: 5, eclipse: false, rad: 1,
        learn: "Dives close to Jupiter, then swings far out, which limits time in the deadly radiation belts." },
      { id: "eq", name: "Close equatorial orbit", dv: 1.2, cap: "JUP", cov: 1.2, life: 3, eclipse: false, rad: 3,
        learn: "More observations, but the spacecraft sits inside the strongest radiation belts the whole time." } ] }
};

const PARTS = {
  structure: { label: "Structure", opts: [
    { id: "light", name: "Lightweight composite", mass: 80, cost: 18, shield: 0, learn: "Saves mass, but costs more to build." },
    { id: "std", name: "Aluminium frame", mass: 120, cost: 8, shield: 0, learn: "Cheap and proven. The usual choice." },
    { id: "vault", name: "Radiation-shielded vault", mass: 220, cost: 35, shield: 2, learn: "Thick walls protect electronics from radiation, like Juno's titanium vault. Heavy!" } ] },
  power: { label: "Power source", opts: [
    { id: "solS", name: "Small solar panels", mass: 25, cost: 10, gen: 800, solar: true, learn: "800 W near Earth. Sunlight gets weaker with distance squared." },
    { id: "solL", name: "Large solar panels", mass: 70, cost: 30, gen: 2500, solar: true, learn: "2,500 W near Earth. Enough for most inner solar system missions." },
    { id: "solXL", name: "Giant solar wings", mass: 340, cost: 70, gen: 14000, solar: true, learn: "Juno-class wings: about 14,000 W at Earth, only about 500 W at Jupiter." },
    { id: "rtg", name: "Nuclear battery (RTG)", mass: 45, cost: 110, gen: 110, solar: false, learn: "About 110 W from decaying plutonium, anywhere, day or night. Very expensive." } ] },
  battery: { label: "Battery", opts: [
    { id: "batS", name: "Small battery", mass: 10, cost: 3, wh: 500, learn: "Enough to get through a short shadow pass." },
    { id: "batL", name: "Large battery", mass: 35, cost: 10, wh: 2000, learn: "Keeps everything running through long eclipses and emergencies." } ] },
  computer: { label: "Onboard computer", opts: [
    { id: "cpu", name: "Standard computer", mass: 5, cost: 5, w: 20, hard: 0, learn: "Fast and cheap, but radiation can make it crash." },
    { id: "cpuR", name: "Radiation-hardened computer", mass: 10, cost: 20, w: 30, hard: 2, learn: "Slower, but survives radiation. Most deep-space missions use one." } ] },
  adcs: { label: "Pointing (attitude control)", opts: [
    { id: "adB", name: "Basic reaction wheels", mass: 15, cost: 5, w: 30, point: 0.85, spare: false, learn: "Spinning wheels turn the spacecraft. Good enough for rough pointing." },
    { id: "adP", name: "Precision wheels + star trackers", mass: 30, cost: 18, w: 60, point: 1, spare: true, learn: "Star cameras give very accurate pointing for sharp images. Includes a spare wheel." } ] },
  comms: { label: "Communications", opts: [
    { id: "lga", name: "Low-gain antenna", mass: 5, cost: 3, w: 20, rate: 2, learn: "Small and simple, but sends data slowly." },
    { id: "mga", name: "Medium-gain antenna", mass: 20, cost: 12, w: 60, rate: 8, learn: "A good balance of speed, mass and power." },
    { id: "hga", name: "High-gain dish", mass: 45, cost: 30, w: 100, rate: 40, learn: "A big dish sends lots of data, but must be pointed precisely at Earth." } ] }
};

const INST = [
  { id: "cam", name: "High-resolution camera", mass: 65, w: 60, cost: 40, data: 4, sci: 25, point: true, fit: { earth: 1, mars: 1, jupiter: 0.6 }, learn: "Sharp images, but creates huge amounts of data." },
  { id: "spec", name: "Imaging spectrometer", mass: 35, w: 45, cost: 35, data: 3, sci: 22, point: true, fit: { earth: 1, mars: 1, jupiter: 0.8 }, learn: "Splits light into colours to reveal what things are made of." },
  { id: "radar", name: "Radar sounder", mass: 20, w: 100, cost: 30, data: 1.5, sci: 18, fit: { earth: 0.6, mars: 1, jupiter: 0.7 }, learn: "Sees through the ground to find buried ice. Needs a lot of power." },
  { id: "therm", name: "Thermal imager", mass: 15, w: 20, cost: 15, data: 1, sci: 12, fit: { earth: 1, mars: 0.9, jupiter: 0.6 }, learn: "Measures heat: fires, volcanoes, warm ground." },
  { id: "mwr", name: "Microwave radiometer", mass: 45, w: 50, cost: 30, data: 0.3, sci: 20, fit: { earth: 0.8, mars: 0.5, jupiter: 1 }, learn: "Senses deep below cloud tops. Juno uses one to look inside Jupiter." },
  { id: "mag", name: "Magnetometer", mass: 5, w: 5, cost: 8, data: 0.05, sci: 8, fit: { earth: 0.5, mars: 0.6, jupiter: 1 }, learn: "Measures magnetic fields. Tiny, cheap, little data." },
  { id: "part", name: "Particle & plasma detector", mass: 12, w: 15, cost: 12, data: 0.2, sci: 10, fit: { earth: 0.4, mars: 0.6, jupiter: 1 }, learn: "Counts charged particles in space around the planet." }
];

const LV = [
  { id: "small", name: "Small launcher", cost: 8, cap: { LEO: 300, GEO: 0, MARS: 0, JUP: 0 }, learn: "Cheap rides for small satellites. Low Earth orbit only." },
  { id: "med", name: "Medium launcher", cost: 70, cap: { LEO: 15000, GEO: 5500, MARS: 4000, JUP: 1000 }, learn: "The workhorse for most science missions." },
  { id: "heavy", name: "Heavy launcher", cost: 150, cap: { LEO: 50000, GEO: 20000, MARS: 15000, JUP: 5000 }, learn: "Huge lift for heavy or far-away missions. Costly." }
];

const ROLES = [
  { name: "Mission Lead", icon: "", owns: ["orbit", "launch"], goal: "Keep at least 10% of the budget unspent.", ok: (r, s) => s.budget - r.cost >= 0.1 * s.budget },
  { name: "Spacecraft Engineer", icon: "", owns: ["structure", "power", "battery", "computer", "adcs"], goal: "Keep at least a 20% power margin.", ok: r => r.gen >= 1.2 * r.use },
  { name: "Science Lead", icon: "", owns: ["inst"], goal: "Return at least 120% of the science target.", ok: (r, s) => r.sciFinal >= 1.2 * s.target.sci },
  { name: "Comms & Ops", icon: "", owns: ["comms", "ops"], goal: "Downlink capacity must cover all data generated.", ok: r => r.link >= r.data }
];

const OPT = {};
Object.values(PARTS).forEach(p => p.opts.forEach(o => OPT[o.id] = o));
INST.forEach(o => OPT[o.id] = o); LV.forEach(o => OPT[o.id] = o);

// ---------- Model ----------
const sum = (a, k) => a.reduce((t, x) => t + (x[k] || 0), 0);
const PART_KEYS = ["structure", "power", "battery", "computer", "adcs", "comms"];

function compute(d) {
  const s = SCEN[d.scen], o = s.orbits.find(x => x.id === d.orbit);
  const parts = PART_KEYS.map(k => OPT[d[k]]), inst = d.inst.map(i => OPT[i]), lv = OPT[d.launch], pw = OPT[d.power];
  const dry = BUS.mass + sum(parts, "mass") + sum(inst, "mass");
  const prop = dry * (Math.exp(o.dv * 1000 / (G * ISP)) - 1); // Tsiolkovsky rocket equation
  const wet = dry + prop, cap = lv.cap[o.cap];
  const gen = pw.solar ? pw.gen * s.irr / EARTH_SUN : pw.gen;
  const use = BUS.w + sum(parts, "w") + sum(inst, "w");
  const data = sum(inst, "data");
  const link = OPT[d.comms].rate * s.comms * (o.link || 1);
  const cost = sum(parts, "cost") + sum(inst, "cost") + lv.cost + s.ops * s.target.years;
  const radExcess = Math.max(0, s.rad + o.rad - OPT[d.structure].shield - OPT[d.computer].hard);
  const lifeF = Math.max(0.1, 1 - radExcess * 0.25);
  const life = o.life * lifeF;
  const duty = Math.min(1, gen / use);
  const battNeed = o.eclipse ? use * 1.2 : 0; // ~35 min shadow, battery only drained to 50%
  const battF = OPT[d.battery].wh >= battNeed ? 1 : 0.8;
  const linkF = data ? Math.min(1, link / data) : 1;
  const pointF = inst.some(i => i.point) ? OPT[d.adcs].point : 1;
  const sciRaw = inst.reduce((a, i) => a + i.sci * i.fit[d.scen], 0);
  const sci = sciRaw * o.cov * pointF * duty * battF * linkF;
  return { s, o, lv, dry, prop, wet, cap, gen, use, data, link, cost, radExcess, lifeF, life, duty, battNeed, battF, linkF, pointF, sciRaw, sci };
}

function finish(d, r) {
  const e = d.ev, s = r.s;
  r.sciFinal = r.sci * e.sci; r.lifeFinal = r.life * e.life; r.cost += e.cost;
  const sciR = r.sciFinal / s.target.sci, lifeR = Math.min(1, r.lifeFinal / s.target.years), left = Math.max(0, (s.budget - r.cost) / s.budget);
  r.goals = ROLES.map(g => g.ok(r, s));
  r.score = Math.round(500 * Math.min(sciR, 1.3) / 1.3 + 300 * lifeR + 200 * left) + 50 * r.goals.filter(Boolean).length;
  r.result = sciR >= 1 && lifeR >= 1 ? "FULL SUCCESS" : sciR >= 0.6 && lifeR >= 0.5 ? "PARTIAL SUCCESS" : "MISSION FAILED";
  r.sciR = sciR; r.lifeR = lifeR;
  return r;
}

// ---------- Events during operations ----------
const pct = x => Math.round(x * 100) + "%";
const EVENTS = [
  { id: "storm", title: "Solar storm!", text: () => "A burst of energetic particles from the Sun is heading your way.",
    a: "Switch to safe mode for a week", b: "Keep observing",
    run(d, r, c) {
      if (c === "a") { d.ev.sci *= 0.97; return "Safe and sound. You lost a week of observations (−3% science). Real operators often do exactly this."; }
      if (OPT[d.computer].hard) return "Your radiation-hardened computer shrugged it off. No losses!";
      if (Math.random() < 0.6) { d.ev.sci *= 0.9; d.ev.life *= 0.95; return "The standard computer crashed and rebooted. Recovery took weeks (−10% science, −5% lifetime). Radiation-hardened electronics prevent this."; }
      return "Lucky! No damage this time, but a standard computer is a gamble in a storm.";
    } },
  { id: "wheel", title: "Reaction wheel failure", text: () => "One of the wheels that points the spacecraft has stopped spinning.",
    a: "Use thrusters to point instead", b: "Live with less accurate pointing",
    run(d, r, c) {
      if (OPT[d.adcs].spare) return "Your precision system carried a spare wheel, which took over. No losses!";
      if (c === "a") { d.ev.life *= 0.85; return "Thrusters burn propellant every time you turn, so you will run out of fuel sooner (−15% lifetime)."; }
      d.ev.sci *= 0.88; return "Blurrier pointing means less useful data (−12% science). The Kepler space telescope had to adapt to wheel failures too.";
    } },
  { id: "station", title: "Ground station outage", text: () => "A storm knocks out the big antenna on the ground for 5 days.",
    a: "Store data onboard and send it later", b: "Delete old data to keep collecting",
    run(d, r, c) {
      if (c === "b") { d.ev.sci *= 0.94; return "You kept observing but lost the deleted data (−6% science)."; }
      if (r.link >= r.data * 1.3) return "You had spare downlink capacity, so the backlog cleared in days. Nothing lost!";
      d.ev.sci *= 0.95; return "Your link was already full, so the backlog never fully cleared (−5% science). Spare comms capacity is insurance.";
    } },
  { id: "glitch", title: "Instrument glitch", text: d => `Your ${OPT[d.inst[0]].name.toLowerCase()} is returning strange readings.`,
    a: "Spend 2 weeks recalibrating", b: "Switch it off for good",
    run(d, r, c) {
      if (c === "a") { d.ev.sci *= 0.97; return "Recalibration worked. You lost two weeks of data (−3% science)."; }
      const i = OPT[d.inst[0]], share = i.sci * i.fit[d.scen] / r.sciRaw;
      d.ev.sci *= 1 - share; return `You lost all of its science (−${pct(share)}). Turning instruments off is permanent!`;
    } },
  { id: "cut", title: "Budget cut", text: () => "The space agency has to trim your operations budget.",
    a: "End the mission one year early", b: "Run with a smaller team",
    run(d, r, c) {
      if (c === "a") { d.ev.life *= 0.8; return "Missions often end because of money, not hardware (−20% lifetime)."; }
      d.ev.sci *= 0.92; return "Fewer people to plan observations means less science (−8% science), but the spacecraft keeps going.";
    } },
  { id: "bonus", title: "Surprise opportunity", text: d => SCEN[d.scen].bonus,
    a: "Re-plan to observe it ($5M extra)", b: "Stick to the plan",
    run(d, r, c) {
      if (c === "b") return "Steady as planned. No change.";
      d.ev.cost += 5;
      if (d.inst.some(i => ["cam", "spec", "therm"].includes(i))) { d.ev.sci *= 1.1; return "Great data on a rare event (+10% science)! Flexible missions catch surprises."; }
      return "None of your instruments can image it, so the extra money was wasted.";
    } },
  { id: "eclipse", title: "Long eclipse season", text: () => "Your orbit now spends longer in the planet's shadow, with no sunlight on the panels.",
    a: "Turn off instruments in the shadow", b: "Keep everything running",
    when: (d, r) => r.o.eclipse && OPT[d.power].solar,
    run(d, r, c) {
      if (c === "a") { d.ev.sci *= 0.96; return "Safe choice: you lost a little observing time (−4% science)."; }
      if (OPT[d.battery].wh >= r.use * 2) return "Your large battery carried you through. No losses!";

];

function stats(o, capKey) {
  const b = [];
  if (o.mass != null) b.push(o.mass + " kg");
  if (o.gen) b.push("+" + fmt(o.gen) + " W" + (o.solar ? " at Earth" : ""));
  if (o.w) b.push("uses " + o.w + " W");
  if (o.wh) b.push(fmt(o.wh) + " Wh");
  if (o.rate) b.push(o.rate + " Gb/day link");
  if (o.data) b.push(o.data + " Gb/day data");
  if (o.cost != null) b.push("$" + o.cost + "M");
  if (o.cap) b.push(o.cap[capKey] ? "lifts " + fmt(o.cap[capKey]) + " kg here" : "can't reach this orbit");
  if (o.dv != null) b.push("Δv " + o.dv + " km/s");
  return b.join(" · ");
}
const card = (key, o, on, capKey) => `<button class="opt ${on ? "on" : ""}" data-act="pick" data-k="${key}" data-v="${o.id}" aria-pressed="${on}"><b>${o.name}</b><span class="st">${stats(o, capKey)}</span><small>${o.learn}</small></button>`;

function bar(label, val, max, unit, higherBetter) {
  const r = max ? val / max : (val ? 9 : 0);
  const col = higherBetter ? (r >= 1 ? "var(--ok)" : r >= 0.7 ? "var(--warn)" : "var(--bad)") : (r > 1 ? "var(--bad)" : r > 0.85 ? "var(--warn)" : "var(--ok)");
  return `<div class="bar"><div class="lab"><span>${label}</span><span class="${!higherBetter && r > 1 ? "over" : ""}">${!higherBetter && r > 1 ? "OVER · " : ""}${unit(val)} / ${max ? unit(max) : "—"}</span></div><div class="trk"><div class="fil" style="width:${Math.min(100, r * 100)}%;background:${col}"></div></div></div>`;
}

const mark = m => `<span class="mk ${m}">${m === "ok" ? "✓" : m === "bad" ? "✕" : m === "warn" ? "!" : "·"}</span>`;
function tip(d, r) {
  if (!d.inst.length) return "Start by adding instruments. They are why the mission exists.";
  if (r.cap && r.wet > r.cap) return "Too heavy for this rocket. Fuel grows with mass, so dropping 10 kg of hardware saves even more.";
  if (r.gen < r.use) return "Not enough power, so instruments will only run part of the time.";
  if (r.data > r.link) return "You collect more data than you can send home. The rest is lost.";
  if (r.radExcess > 0) return "Radiation will shorten your mission. Shielding or a hardened computer helps.";
  return "Looking good! Try the launch readiness review.";
}

function explain(d, r) {
  const s = r.s, out = [];
  if (r.cap) out.push([r.wet <= r.cap ? "ok" : "bad", `Mass: ${fmt(r.wet)} kg including ${fmt(r.prop)} kg of fuel for a ${r.o.dv} km/s burn (rocket equation). Rocket limit: ${fmt(r.cap)} kg.`]);
  const sunPct = Math.round(s.irr / EARTH_SUN * 100);
  out.push([r.duty >= 1 ? "ok" : "warn", `Power: ${fmt(r.gen)} W made vs ${fmt(r.use)} W needed.` + (OPT[d.power].solar && sunPct < 100 ? ` At ${s.where} sunlight is only ${sunPct}% as strong as at Earth (NASA Planetary Fact Sheet).` : "") + (r.duty < 1 ? ` Instruments can only run ${pct(r.duty)} of the time.` : "")]);
  if (r.battNeed) out.push([r.battF === 1 ? "ok" : "warn", r.battF === 1 ? "Battery: big enough to get through each pass in the planet's shadow." : `Battery: too small for the shadow passes (needs about ${fmt(r.battNeed)} Wh). You lose 20% of observations.`]);
  out.push([r.linkF >= 1 ? "ok" : "warn", `Data: instruments make ${r.data.toFixed(1)} Gb/day, your link sends ${r.link.toFixed(1)} Gb/day.` + (r.linkF < 1 ? ` Only ${pct(r.linkF)} of the data gets home. A farther target means a weaker signal.` : "")]);
  if (r.pointF < 1) out.push(["warn", "Pointing: cameras and spectrometers need precise pointing. Basic wheels cost you 15% of their quality."]);
  if (s.rad + r.o.rad > 0) out.push([r.radExcess ? "warn" : "ok", r.radExcess ? `Radiation: not enough protection, so electronics wear out early (lifetime ×${r.lifeF.toFixed(2)}).` : "Radiation: your shielding and electronics can handle this environment."]);
  out.push([r.life >= s.target.years ? "ok" : "warn", `Lifetime: expected ${r.life.toFixed(1)} years vs ${s.target.years}-year goal.`]);
  out.push([r.sci >= s.target.sci ? "ok" : "warn", `Science: ${fmt(r.sci)} expected vs target ${s.target.sci}. Orbit coverage ×${r.o.cov}.`]);
  out.push([r.cost <= s.budget ? "ok" : "bad", `Budget: $${fmt(r.cost)}M of $${s.budget}M.`]);
  return out;
}

// ---------- Leaderboard & sharing ----------
function board(scen) { try { return JSON.parse(localStorage.getItem("ma-board-" + scen) || "[]"); } catch { return []; } }
function saveScore(score) {
  if (S.saved) return; S.saved = true;
  try { const b = board(S.d.scen); b.push({ n: S.team || S.names[0], s: score }); b.sort((x, y) => y.s - x.s); localStorage.setItem("ma-board-" + S.d.scen, JSON.stringify(b.slice(0, 5))); } catch {}
}
function share() {
  const { ev, ...design } = S.d;
  const url = location.href.split("#")[0] + "#" + btoa(JSON.stringify(design));
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => alert("Share link copied!"), () => prompt("Copy this link:", url));
}

// ---------- Actions ----------
const ACT = {
  go: v => { S.screen = v; },
  players: v => { S.players = +v; },
  scen: v => { S.d = newDesign(v); S.screen = "design"; },
  pick: (v, k) => {
    if (k === "inst") { const a = S.d.inst; a.includes(v) ? a.splice(a.indexOf(v), 1) : a.push(v); }
    else S.d[k] = v;
  },
  share: () => { share(); return false; },
  launch: () => {
    const r = compute(S.d);
    S.d.ev = { sci: 1, life: 1, cost: 0, log: [] };
    S.events = EVENTS.filter(e => !e.when || e.when(S.d, r)).sort(() => Math.random() - 0.5).slice(0, 3);
    S.ei = 0; S.out = null; S.saved = false; S.screen = "launch";
    setTimeout(() => { S.screen = "ops"; render(); }, 2800);
  },
  choose: v => { const ev = S.events[S.ei]; S.out = ev.run(S.d, compute(S.d), v); S.d.ev.log.push([ev.title, S.out]); },
  next: () => { S.out = null; if (++S.ei >= S.events.length) S.screen = "report"; },
  retry: () => { S.screen = "design"; }
};

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const y = window.scrollY;
  if (ACT[b.dataset.act](b.dataset.v, b.dataset.k) === false) return;
  render();
  if (b.dataset.act === "pick") window.scrollTo(0, y); else window.scrollTo(0, 0);
});
document.addEventListener("input", e => {
  if (e.target.id === "team") S.team = e.target.value;
  if (e.target.dataset.name) S.names[+e.target.dataset.name] = e.target.value || "Player " + (+e.target.dataset.name + 1);
});

function render() { $app.innerHTML = SCREENS[S.screen](); }

// Load a shared design from the URL, if any
// Only accept IDs that exist; anything unknown falls back to the default design
try {
  if (location.hash.length > 1) {
    const d = JSON.parse(atob(location.hash.slice(1)));
    if (Object.hasOwn(SCEN, d.scen)) {
      const base = newDesign(d.scen), has = (list, id) => list.some(x => x.id === id);
      if (has(SCEN[d.scen].orbits, d.orbit)) base.orbit = d.orbit;
      PART_KEYS.forEach(k => { if (has(PARTS[k].opts, d[k])) base[k] = d[k]; });
      if (has(LV, d.launch)) base.launch = d.launch;
      if (Array.isArray(d.inst)) base.inst = [...new Set(d.inst.filter(i => has(INST, i)))];
      S.d = base; S.screen = "design";
    }
  }
} catch {}
render();
</script>
