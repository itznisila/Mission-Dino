<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Dino – Space Mission Design Game</title>
<meta name="description" content="Design, launch and operate your own space mission. A NASA Space Apps Challenge 2026 entry (Space Mission Design Game).">
<meta name="ai-assistance" content="Game code written with assistance from an AI model (Claude). Game design, testing and data choices by the team.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#5aa9ff;--orange:#ff8c42;--gut:clamp(16px,4vw,72px);--top:28px;--bg:#000000;--txt:#ffffff;--mut:#969696;--line:#2b2b2b;--ok:#ffffff;--warn:#969696;--bad:#555555}
*{box-sizing:border-box}
html{background:var(--bg);overflow-x:clip}
body{margin:0;font-family:"D-DIN","Barlow",Arial,Helvetica,sans-serif;color:var(--txt);min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow-x:clip;letter-spacing:.02em;
 background:radial-gradient(1px 1px at 12% 22%,#fff9,transparent),radial-gradient(1px 1px at 72% 78%,#fff6,transparent),radial-gradient(1px 1px at 42% 58%,#fff5,transparent),radial-gradient(1px 1px at 86% 14%,#fff8,transparent),radial-gradient(1px 1px at 28% 88%,#fff5,transparent),#000}
main{flex:1;width:100%;padding:var(--top) var(--gut)}
h1,h2,h3,.btn,.badge,.lab,th{text-transform:uppercase;letter-spacing:.12em}
h1{font-size:clamp(2.4rem,7vw,8rem);font-weight:700;margin:.1em 0;line-height:1}
h2{font-size:1.6rem;font-weight:600;margin:.3em 0}h3{font-size:1rem;font-weight:600;margin:.2em 0 .8em}
p{line-height:1.6}.mut{color:var(--mut)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:transparent;color:#fff;border:2px solid #fff;border-radius:0;padding:14px 30px;font-weight:600;font-size:.9rem;transition:background .25s,color .25s}
.btn:hover{background:#fff;color:#000}
.btn.ghost{border-color:var(--mut);color:var(--mut)}.btn.ghost:hover{background:var(--mut);color:#000}
.btn.sel{background:#fff;color:#000}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:transparent;border:1px solid var(--line);border-radius:0;padding:24px;margin:16px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr))}
.opt{text-align:left;background:#000;border:1px solid var(--line);border-radius:0;padding:16px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s,background .2s}
.opt:hover{border-color:#fff}
.opt b{text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.opt.on{background:#fff;color:#000;border-color:#fff}.opt.on small,.opt.on .st{color:#444}
.opt small{color:var(--mut);line-height:1.45}.st{font-size:.82rem;color:#cfcfcf;letter-spacing:.04em}
.layout{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,24vw,440px);gap:24px;align-items:start}
.dash{position:sticky;top:16px;background:#000}
.bar{margin:14px 0}.bar .lab{display:flex;justify-content:space-between;font-size:.75rem;color:#cfcfcf}
.bar .trk{height:4px;background:#1c1c1c;margin-top:6px}
.bar .fil{height:100%}
.over{color:#fff;font-weight:700}
.badge{display:inline-block;border:1px solid var(--mut);padding:3px 10px;font-size:.68rem;margin-left:10px;color:var(--mut);vertical-align:middle}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chk{list-style:none;padding:0}.chk li{margin:10px 0;line-height:1.5;padding-left:28px;position:relative}
.mk{position:absolute;left:0;top:0;width:18px;height:18px;border:1px solid currentColor;font-size:.7rem;display:inline-flex;align-items:center;justify-content:center}
.mk.ok{background:#fff;color:#000;border-color:#fff}.mk.warn{color:var(--mut)}.mk.bad{color:#fff}
input{background:#000;border:1px solid var(--mut);color:var(--txt);border-radius:0;padding:10px;font:inherit}
.kick{color:var(--mut);letter-spacing:.3em;text-transform:uppercase;font-size:.85rem}
.ship{width:14px;height:90px;background:linear-gradient(#fff 0 80%,#969696 80%);display:inline-block;position:relative;animation:up 2.6s ease-in forwards}
.ship:after{content:"";position:absolute;left:3px;top:90px;width:8px;height:40px;background:linear-gradient(#fff,transparent);opacity:.8}
@keyframes up{0%{transform:translateY(0)}20%{transform:translateY(4px)}100%{transform:translateY(-460px)}}
.big{font-size:clamp(2rem,6vw,3.6rem);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
footer{color:var(--mut);font-size:.72rem;text-align:center;padding:30px var(--gut);letter-spacing:.12em;text-transform:uppercase;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse}td,th{overflow-wrap:anywhere;padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}
/* ---------- Mission select ---------- */
main:has(>.dest){display:flex;flex-direction:column}
.dest{flex:1;position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:clamp(22px,4vh,44px);
 margin:calc(-1 * var(--top)) calc(-1 * var(--gut)) 0;padding:clamp(28px,5vh,64px) var(--gut)}
.dest::before{content:"";position:absolute;inset:0;z-index:-2;background:
 radial-gradient(ellipse 70% 40% at 50% 112%,#5aa9ff2e,transparent 70%),
 radial-gradient(ellipse 45% 35% at 92% 0%,#ff8c4214,transparent 70%),
 radial-gradient(ellipse 40% 40% at 0% 30%,#5aa9ff0d,transparent 70%),#000}
.dest::after,.lhero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;animation:twinkle 6s ease-in-out infinite alternate;background:
 radial-gradient(1px 1px at 8% 18%,#fff,transparent),radial-gradient(1px 1px at 23% 62%,#fffb,transparent),radial-gradient(1.5px 1.5px at 37% 12%,#fff,transparent),
 radial-gradient(1px 1px at 51% 41%,#fff9,transparent),radial-gradient(1px 1px at 64% 8%,#fffc,transparent),radial-gradient(1.5px 1.5px at 78% 33%,#fff,transparent),
 radial-gradient(1px 1px at 89% 71%,#fffa,transparent),radial-gradient(1px 1px at 14% 88%,#fff9,transparent),radial-gradient(1px 1px at 58% 92%,#fffb,transparent),
 radial-gradient(1px 1px at 96% 12%,#fff,transparent),radial-gradient(1px 1px at 44% 78%,#fff8,transparent),radial-gradient(1px 1px at 3% 48%,#fffa,transparent)}
@keyframes twinkle{from{opacity:.45}to{opacity:1}}
.dest-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.dest-head{max-width:860px}
.dest-title{font-size:clamp(2rem,5.2vw,4.4rem);font-weight:700;line-height:1.05;letter-spacing:.1em;margin:.2em 0 .35em}
.dest-sub{font-size:clamp(1rem,1.25vw,1.15rem);max-width:660px;margin:0}
.missions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2vw,28px)}
.mcard{--acc:var(--blue);position:relative;display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;
 border:1px solid #ffffff1f;background:linear-gradient(180deg,#ffffff0f,#ffffff03);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
 transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .4s,box-shadow .4s}
.m-mars{--acc:var(--orange)}.m-jupiter{--acc:#f2cf9b}
.mcard:hover,.mcard:focus-visible{transform:translateY(-6px);border-color:var(--acc);outline:none;
 box-shadow:0 0 0 1px var(--acc),0 24px 70px -24px var(--acc)}
.mvis{position:relative;display:grid;place-items:center;height:clamp(160px,24vh,280px);overflow:hidden;border-bottom:1px solid #ffffff14;background:
 radial-gradient(ellipse 70% 60% at 50% 115%,color-mix(in srgb,var(--acc) 28%,transparent),transparent 70%),
 radial-gradient(1px 1px at 12% 22%,#fffa,transparent),radial-gradient(1px 1px at 84% 18%,#fff8,transparent),radial-gradient(1px 1px at 70% 80%,#fff7,transparent),
 radial-gradient(1px 1px at 26% 76%,#fff6,transparent),radial-gradient(1px 1px at 50% 10%,#fff9,transparent),#02040a}
.planet{position:relative;height:72%;aspect-ratio:1;border-radius:50%;transition:transform .9s cubic-bezier(.2,.8,.2,1);
 box-shadow:inset -26px -18px 46px rgba(0,0,0,.92),inset 6px 4px 16px rgba(255,255,255,.2),0 0 60px -10px var(--acc)}
.mcard:hover .planet,.mcard:focus-visible .planet{transform:scale(1.07) rotate(-5deg)}
.m-earth .planet{background:
 radial-gradient(ellipse 34% 7% at 46% 28%,#ffffffb5,transparent 70%),radial-gradient(ellipse 26% 6% at 64% 72%,#ffffff8c,transparent 70%),
 radial-gradient(ellipse 16% 22% at 34% 48%,#3f9a5f 0 60%,transparent 72%),radial-gradient(ellipse 20% 13% at 64% 46%,#348652 0 55%,transparent 72%),
 radial-gradient(ellipse 12% 16% at 52% 80%,#3a8a55 0 50%,transparent 72%),radial-gradient(circle at 35% 30%,#5db2ff,#1d62bd 55%,#08254f)}
.m-mars .planet{background:
 radial-gradient(ellipse 30% 9% at 50% 5%,#fff 0 55%,transparent 72%),radial-gradient(ellipse 26% 9% at 40% 56%,#7a2c14b0,transparent 70%),
 radial-gradient(ellipse 14% 8% at 68% 38%,#8a3818a8,transparent 70%),radial-gradient(ellipse 18% 6% at 58% 74%,#6e2610a0,transparent 70%),
 radial-gradient(circle at 35% 30%,#ffa067,#c9562b 55%,#5a1f0c)}
.m-jupiter .planet{background:
 radial-gradient(ellipse 13% 7% at 62% 63%,#c4552f 0 60%,#c4552f00 75%),
 repeating-linear-gradient(176deg,#ecd8b6 0 7%,#c8976a 7% 11%,#f4e7d0 11% 17%,#a9764e 17% 20%,#e3caa3 20% 27%)}
.m-earth .planet::before,.m-jupiter .planet::before{content:"";position:absolute;width:9%;aspect-ratio:1;border-radius:50%;left:-22%;top:16%;
 background:#d9d9d9;box-shadow:inset -3px -2px 4px #000c}
.mbody{display:flex;flex-direction:column;gap:14px;flex:1;padding:clamp(18px,2vw,28px)}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.diff{display:inline-flex;align-items:center;gap:4px;color:var(--acc);font-weight:600}
.diff i{width:16px;height:4px;background:#ffffff26}
.diff i:nth-of-type(3){margin-right:6px}
.d1 i:nth-of-type(1),.d2 i:nth-of-type(-n+2),.d3 i{background:var(--acc)}
.mname{font-size:clamp(1.25rem,1.7vw,1.7rem);font-weight:700;text-transform:uppercase;letter-spacing:.1em;line-height:1.15}
.mgoal{flex:1;color:#c9c9c9;line-height:1.55}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:14px 0;border-block:1px solid #ffffff14}
.mstats span{display:flex;flex-direction:column;gap:3px;font-size:1.1rem;font-weight:600}
.mstats em{font-style:normal;font-weight:400;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.mcta{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border:1px solid #ffffff40;font-size:.8rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
 transition:background .3s,color .3s,border-color .3s}
.mcta span{transition:transform .3s}
.mcard:hover .mcta,.mcard:focus-visible .mcta{background:var(--acc);border-color:var(--acc);color:#000}
.mcard:hover .mcta span,.mcard:focus-visible .mcta span{transform:translateX(5px)}
.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * .12s)}
@keyframes rise{from{opacity:0;transform:translateY(28px)}}
@media(max-width:980px){.missions{grid-template-columns:1fr}.mcard{flex-direction:row}
 .mvis{height:auto;width:clamp(130px,32%,280px);flex-shrink:0;border-bottom:0;border-right:1px solid #ffffff14}.planet{height:auto;width:68%}}
@media(max-width:560px){.mcard{flex-direction:column}.mvis{width:auto;height:170px;border-right:0;border-bottom:1px solid #ffffff14}.planet{width:auto;height:70%}}
@media(prefers-reduced-motion:reduce){.rise,.dest::after{animation:none}.mcard,.planet,.mcta,.mcta span{transition:none}}
/* ---------- Landing ---------- */
.land{margin:calc(-1 * var(--top)) calc(-1 * var(--gut)) calc(-1 * var(--top))}
.lhero{position:relative;isolation:isolate;overflow:hidden;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;padding:0 var(--gut) clamp(22px,4vh,40px)}
.lhero::before{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;background:
 linear-gradient(90deg,#000 0%,#000d 26%,#0007 50%,transparent 72%),linear-gradient(0deg,#000 0,transparent 26%),linear-gradient(180deg,#000b 0,transparent 20%)}
.lhero::after{z-index:-4}
.lmoon{position:absolute;z-index:-3;top:50%;right:-9vw;width:min(106vh,74vw);aspect-ratio:1;translate:0 -50%}
.lmoon img{display:block;width:100%;height:100%;object-fit:cover;mix-blend-mode:screen;filter:contrast(1.12) brightness(1.04);animation:drift 50s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1) rotate(0)}to{transform:scale(1.05) rotate(-5deg)}}
.lmoon::before{content:"";position:absolute;inset:9%;border-radius:50%;z-index:-1;box-shadow:0 0 140px 20px #5aa9ff1f}
.lmoon::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 72% 28%,transparent 34%,#000a 58%,#000 76%)}
.lmoon.nofoto::before{background:radial-gradient(ellipse 22% 16% at 40% 36%,#0003,transparent 70%),radial-gradient(ellipse 18% 14% at 58% 58%,#00000029,transparent 70%),radial-gradient(circle at 66% 30%,#0000002e 0 3%,transparent 4%),radial-gradient(circle at 48% 72%,#00000024 0 2.5%,transparent 3.5%),radial-gradient(circle at 62% 35%,#e2e2e2,#9a9a9a 45%,#2a2a2a 80%)}
.lnav{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0;border-bottom:1px solid #ffffff1a}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:.95rem;letter-spacing:.34em;text-transform:uppercase}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 14px var(--blue)}
.lnav-links{display:flex;gap:clamp(16px,2.6vw,40px)}
.lnav-links button{position:relative;background:none;border:0;padding:6px 0;color:#bdbdbd;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;transition:color .3s}
.lnav-links button::after{content:"";position:absolute;inset:auto 0 0;height:1px;background:var(--blue);transform:scaleX(0);transform-origin:left;transition:transform .35s}
.lnav-links button:hover,.lnav-links button:focus-visible{color:#fff}.lnav-links button:hover::after,.lnav-links button:focus-visible::after{transform:scaleX(1)}
.btn.sm{padding:10px 20px;font-size:.74rem}
.btn.solid{background:#fff;color:#000}.btn.solid:hover{background:var(--blue);border-color:var(--blue)}
.kick.acc{display:flex;align-items:center;gap:14px;color:var(--blue)}.kick.acc::before{content:"";width:38px;height:1px;background:currentColor}
.lhero-copy{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:min(780px,100%);padding:clamp(40px,8vh,96px) 0}
.lhero h1{font-size:clamp(2.6rem,6.2vw,6.6rem);line-height:.98;letter-spacing:.05em;margin:.3em 0 .4em}
.lhero h1 em{font-style:normal;color:var(--blue)}
.lhero-lead{font-size:clamp(1rem,1.3vw,1.2rem);color:#cfcfcf;max-width:560px;margin:0 0 34px}
.lhero-meta{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-top:18px;border-top:1px solid #ffffff1a;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}
.cue{display:flex;align-items:center;gap:12px}.cue::after{content:"";width:1px;height:28px;background:linear-gradient(var(--blue),transparent);animation:cue 2.2s ease-in-out infinite}
@keyframes cue{0%,100%{transform:scaleY(.4);transform-origin:top}50%{transform:scaleY(1)}}
.lsec{position:relative;padding:clamp(64px,11vh,130px) var(--gut);border-top:1px solid #ffffff12}
.lsec.glow{background:radial-gradient(ellipse 60% 50% at 100% 0%,#5aa9ff12,transparent 70%)}
.lhead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(28px,5vh,56px)}
.lhead h2{font-size:clamp(1.9rem,4vw,3.6rem);font-weight:700;line-height:1.05;letter-spacing:.08em;margin:.35em 0 0;max-width:900px}
.lhead p{max-width:440px;margin:0;color:var(--mut)}
.ph{position:relative;overflow:hidden;background:radial-gradient(ellipse at 70% 20%,#5aa9ff1a,transparent 60%),linear-gradient(160deg,#0b1220,#000)}
.ph img,.fcard>img,.lcta>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,1.8vw,24px)}
.fcard{--acc:var(--blue);position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;min-height:clamp(420px,62vh,600px);padding:clamp(20px,2.2vw,32px);
 text-align:left;border:1px solid #ffffff1f;background:#05070c;transition:translate .5s cubic-bezier(.2,.8,.2,1),border-color .4s,box-shadow .4s}
.fcard>img{z-index:-2}
.fcard::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#0000 15%,#000b 55%,#000 100%)}
.fcard:hover,.fcard:focus-visible{translate:0 -6px;border-color:var(--acc);outline:none;box-shadow:0 0 0 1px var(--acc),0 30px 80px -30px var(--acc)}
.fcard:hover>img,.fcard:focus-visible>img,.ncard:hover .ph img{transform:scale(1.06)}
.fcard .mtop{color:#bdbdbd}.fcard .mgoal{flex:0;color:#d4d4d4}
.fcard:hover .mcta,.fcard:focus-visible .mcta{background:var(--acc);border-color:var(--acc);color:#000}
.fcard:hover .mcta span,.fcard:focus-visible .mcta span{transform:translateX(5px)}
.sgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(12px,1.4vw,20px)}
.stile{display:flex;flex-direction:column;align-items:center;gap:16px;padding:clamp(20px,2vw,30px) 16px;text-align:center;border:1px solid #ffffff14;background:linear-gradient(180deg,#ffffff0a,#ffffff02);transition:translate .4s,border-color .4s}
.stile:hover{translate:0 -4px;border-color:#ffffff3d}
.sorb{display:grid;place-items:center;width:100%;height:clamp(110px,14vw,170px)}
.sorb img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:screen;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.stile:hover .sorb img{transform:scale(1.08) rotate(-4deg)}
.sorb.nofoto::before{content:"";height:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#888,#222 70%)}
.stile b{font-size:1.05rem;letter-spacing:.18em;text-transform:uppercase}
.sfacts{display:grid;gap:8px;width:100%;margin:0;padding-top:14px;border-top:1px solid #ffffff14}
.sfacts div{display:flex;justify-content:space-between;gap:8px;font-size:.82rem}
.sfacts dt{color:var(--mut);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;align-self:center}.sfacts dd{margin:0;font-weight:600}
.stag{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
button.stag{background:none;border:1px solid var(--blue);color:var(--blue);padding:7px 12px;transition:background .3s,color .3s}
button.stag:hover{background:var(--blue);color:#000}
.ngrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,1.8vw,24px)}
.ncard{display:flex;flex-direction:column;border:1px solid #ffffff14;background:#050505;transition:translate .4s,border-color .4s}
.ncard:hover{translate:0 -4px;border-color:#ffffff40}
.ncard .ph{aspect-ratio:16/10}
.nbody{display:flex;flex-direction:column;gap:12px;flex:1;padding:clamp(18px,1.8vw,26px)}
.nmeta{display:flex;gap:12px;flex-wrap:wrap;font-size:.64rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}.nmeta b{color:var(--blue);font-weight:600}
.ncard h3,.apod-txt h3{font-size:clamp(1.05rem,1.3vw,1.25rem);line-height:1.3;letter-spacing:.06em;margin:0}
.ncard p{flex:1;margin:0;color:#bdbdbd;font-size:.95rem}
.nlink{align-self:flex-start;padding-bottom:4px;border-bottom:1px solid var(--blue);color:#fff;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;transition:color .3s}
.nlink:hover{color:var(--blue)}
.lapod{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);border:1px solid #ffffff14;background:#050505}
.lapod .ph{min-height:clamp(320px,64vh,720px)}
.apod-txt{display:flex;flex-direction:column;gap:16px;justify-content:center;padding:clamp(22px,3vw,48px)}
.apod-txt h3{font-size:clamp(1.4rem,2.2vw,2.2rem);line-height:1.15}
.apod-txt p{margin:0;color:#bdbdbd;display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical;overflow:hidden}
.apod-txt small{color:var(--mut);letter-spacing:.06em;line-height:1.5}
.lcta{position:relative;isolation:isolate;overflow:hidden;padding:clamp(100px,20vh,220px) var(--gut);text-align:center;border-top:1px solid #ffffff12}

// ---------- Model ----------
const sum = (a, k) => a.reduce((t, x) => t + (x[k] || 0), 0);
const PART_KEYS = ["structure", "power", "battery", "computer", "adcs", "comms"];

function compute(d) {
  const s = SCEN[d.scen], o = s.orbits.find(x => x.id === d.orbit);
  const parts = PART_KEYS.map(k => OPT[d[k]]), inst = d.inst.map(i => OPT[i]), lv = OPT[d.launch], pw = OPT[d.power];
  const dry = BUS.mass + sum(parts, "mass") + sum(inst, "mass");
  const prop = dry * (Math.exp(o.dv * 1000 / (G * ISP)) - 1); // Tsiolkovsky rocket equation
  const wet = dry + prop, cap = lv.cap[o.cap];
  const gen = pw.solar ? pw.gen * s.irr / EARTH_SUN : pw.gen;
  const use = BUS.w + sum(parts, "w") + sum(inst, "w");
  const data = sum(inst, "data");
  const link = OPT[d.comms].rate * s.comms * (o.link || 1);
  const cost = sum(parts, "cost") + sum(inst, "cost") + lv.cost + s.ops * s.target.years;
  const radExcess = Math.max(0, s.rad + o.rad - OPT[d.structure].shield - OPT[d.computer].hard);
  const lifeF = Math.max(0.1, 1 - radExcess * 0.25);
  const life = o.life * lifeF;
  const duty = Math.min(1, gen / use);
  const battNeed = o.eclipse ? use * 1.2 : 0; // ~35 min shadow, battery only drained to 50%
  const battF = OPT[d.battery].wh >= battNeed ? 1 : 0.8;
  const linkF = data ? Math.min(1, link / data) : 1;
  const pointF = inst.some(i => i.point) ? OPT[d.adcs].point : 1;
  const sciRaw = inst.reduce((a, i) => a + i.sci * i.fit[d.scen], 0);
  const sci = sciRaw * o.cov * pointF * duty * battF * linkF;
  return { s, o, lv, dry, prop, wet, cap, gen, use, data, link, cost, radExcess, lifeF, life, duty, battNeed, battF, linkF, pointF, sciRaw, sci };
}

function finish(d, r) {
  const e = d.ev, s = r.s;
  r.sciFinal = r.sci * e.sci; r.lifeFinal = r.life * e.life; r.cost += e.cost;
  const sciR = r.sciFinal / s.target.sci, lifeR = Math.min(1, r.lifeFinal / s.target.years), left = Math.max(0, (s.budget - r.cost) / s.budget);
  r.goals = ROLES.map(g => g.ok(r, s));
  r.score = Math.round(500 * Math.min(sciR, 1.3) / 1.3 + 300 * lifeR + 200 * left) + 50 * r.goals.filter(Boolean).length;
  r.result = sciR >= 1 && lifeR >= 1 ? "FULL SUCCESS" : sciR >= 0.6 && lifeR >= 0.5 ? "PARTIAL SUCCESS" : "MISSION FAILED";
  r.sciR = sciR; r.lifeR = lifeR;
  return r;
}

  scen: () => `

      </header>
      <button class="btn ghost rise" style="--i:1" data-act="go" data-v="setup">← Back</button>
      </div>
      <div class="missions">${Object.entries(SCEN).map(([k, s], i) => `
        <button class="mcard m-${k} rise" style="--i:${i + 1}" data-act="scen" data-v="${k}">
          <span class="mvis" aria-hidden="true"><span class="planet"></span></span>

            <span class="mstats"><span><em>Budget</em>$${s.budget}M</span><span><em>Science target</em>${s.target.sci}</span><span><em>Duration</em>${s.target.years} yrs</span></span>
            <span class="mcta">Select mission <span aria-hidden="true">→</span></span>
          </span>
        </button>`).join("")}
      </div>
    </section>`,

  brief: () => {
    const k = S.d.scen, s = SCEN[k], w = WORLDS.find(x => x.n.toLowerCase() === k), sun = s.irr / EARTH_SUN, ops = s.ops * s.target.years;
    const dv = s.orbits.map(o => o.dv), caps = [...new Set(s.orbits.map(o => o.cap))];
    const level = (v, lo, hi, inverse) => { const n = inverse ? (v >= lo ? 1 : v >= hi ? 2 : 3) : (v <= lo ? 1 : v <= hi ? 2 : 3); return `<span class="diff d${n} r${n}"><i></i><i></i><i></i>${["Low", "Moderate", "Severe"][n - 1]}</span>`; };
    const eclipse = s.orbits.some(o => o.eclipse);
    const risks = [
      ["Solar storm", "A radiation-hardened computer rides it out."],
      ["Reaction wheel failure", "Precision pointing carries a spare wheel."],
      ["Ground station outage", "Spare downlink capacity clears the backlog."],
      ["Instrument glitch", "Recalibrating costs time; switching off is permanent."],
      ["Budget cut", "Money left over gives you room to choose."],
      ...(eclipse ? [["Long eclipse season", "A large battery keeps solar craft running in shadow."]] : []),
      ["Surprise opportunity", s.bonus + " Imaging instruments can capture it."]
    ];
    const objectives = [
      ["Return the science", s.goal, `Science score of at least ${s.target.sci} points`],
      ["Stay operational", "Radiation, power and fuel choices decide how long your spacecraft survives.", `Spacecraft lifetime of at least ${s.target.years} years`],
      ["Stay on budget", `Hardware, launch and ${s.target.years} years of operations must fit the budget. Unspent money adds to your score.`, `Total cost of $${s.budget}M or less`],
      ["Meet team goals", ROLES.map(r => `${r.name}: ${r.goal.replace(/\.$/, "")}`).join(". ") + ".", "+50 points for each role goal met"]
    ];
    return `
    <section class="dest brief">
      <div class="dest-top">
        <header class="dest-head rise">
          <div class="kick">Step 03 · Mission briefing</div>
          <h2 class="dest-title">Your mission starts here.</h2>
          <p class="mut dest-sub">Review your objectives, understand your resources, and prepare for the challenges ahead.</p>
        </header>
        <button class="btn ghost rise" style="--i:1" data-act="go" data-v="scen">← Back</button>
      </div>
      <div class="bgrid">
        <article class="bpanel wide b-over m-${k} rise" style="--i:1">
          <div class="bvis"><span class="planet" aria-hidden="true"></span>${pic(planetImg(k), `${w.n}, NASA photograph`, "medium")}<span class="bvis-tag">Destination · ${w.n}</span></div>
          <div class="binfo">
            <div class="bh">01 · <b>Mission overview</b></div>
            <span class="mtop"><span>${s.where}</span><span class="diff d${LEVEL[s.diff]}"><i></i><i></i><i></i>${s.diff}</span></span>

              <div><dt>Sunlight</dt><dd>${sun >= 0.995 ? "100" : (sun * 100).toFixed(sun < 0.1 ? 1 : 0)}% of Earth</dd></div><div><dt>Data link</dt><dd>${s.comms}× Earth rate</dd></div><div><dt>Orbit options</dt><dd>${s.orbits.length}</dd></div></dl>
            <p class="breal"><b>Real mission:</b> ${s.real}</p>
          </div>
        </article>

        <article class="bpanel wide rise" style="--i:2">
          <div class="bh">02 · <b>Mission objectives</b></div>
          <div class="bobj">${objectives.map(([t, d, c], i) => `
            <div class="bcard"><span class="bnum">0${i + 1}</span><b>${t}</b><p>${d}</p><span class="bcrit"><span><em>Complete when</em>${c}</span></span></div>`).join("")}
          </div>
          <p class="brule">Full success: objectives 01 and 02 met. Partial success: at least 60% of the science and half the lifetime.</p>
        </article>

        <article class="bpanel rise" style="--i:3">
          <div class="bh">03 · <b>Resources</b></div>
          <div class="bstats">
            <div class="bstat"><em>Budget</em><b>$${s.budget}M</b><small>$${ops}M goes to operations</small></div>
            <div class="bstat"><em>Science target</em><b>${s.target.sci}</b><small>points to return</small></div>
            <div class="bstat"><em>Duration</em><b>${s.target.years} yrs</b><small>minimum lifetime</small></div>
          </div>
          <div class="bsub">Science instruments · value at ${w.n}</div>
          <ul class="beq">${[...INST].sort((a, b) => b.sci * b.fit[k] - a.sci * a.fit[k]).map(i => `<li><span>${i.name}</span><i style="--w:${i.fit[k] * 100}%"></i><span>${Math.round(i.sci * i.fit[k])} pts</span></li>`).join("")}</ul>
          <div class="bsub">Launch vehicles</div>
          <div class="bchips">${LV.map(l => { const ok = caps.some(c => l.cap[c] > 0); return `<span class="bchip${ok ? "" : " off"}">${l.name}${ok ? ` · up to ${fmt(Math.max(...caps.map(c => l.cap[c])))} kg` : " · can't reach"}</span>`; }).join("")}</div>
        </article>

        <article class="bpanel rise" style="--i:4">
          <div class="bh">04 · <b>Mission parameters</b></div>
          <div class="bsub" style="margin-top:0">Environmental conditions</div>
          <div class="bcond">
            <div><b>Radiation</b><small>${s.rad ? "Electronics need shielding or hardening" : "Mostly protected by Earth's magnetic field"}</small>${level(s.rad, 0, 1)}</div>
            <div><b>Sunlight for solar power</b><small>Panels make ${Math.round(sun * 100) || "<1"}% of their Earth power</small>${level(sun, 0.9, 0.3, true)}</div>
            <div><b>Communications</b><small>Data link is ${s.comms}× as fast as from Earth orbit</small>${level(s.comms, 0.9, 0.1, true)}</div>
            <div><b>Fuel to reach orbit</b><small>Δv ${Math.min(...dv)}–${Math.max(...dv)} km/s after launch</small>${level(Math.max(...dv), 0.5, 1.5)}</div>
          </div>
          <div class="bsub">Constraints</div>
          <ul class="blist">
            <li>Everything must fit $${s.budget}M, including $${s.ops}M per year of operations.</li>
            <li>Spacecraft plus fuel must not exceed the rocket's lift to ${s.where.replace(" orbit", "")}.</li>
            <li>Power made must cover power used${eclipse ? ", and batteries must last through eclipses" : ""}.</li>
            <li>Data sent home is capped by your antenna and distance.</li>
          </ul>
        </article>

        <article class="bpanel wide rise" style="--i:5">
          <div class="bh">04 · <b>Exploration risks</b></div>
          <div class="brisk">${risks.map(([t, h]) => `<div><b>${t}</b>${h}</div>`).join("")}</div>
          <p class="brule">Any of these can happen during operations. You will choose how to respond, and your design decides the damage.</p>
        </article>

        <div class="bpanel wide b-act rise" style="--i:6">
          <div><div class="bh" style="margin-bottom:10px">05 · <b>Mission action</b></div><h3>Ready${S.team ? `, ${esc(S.team)}` : ""}?</h3><p>Next you design the spacecraft: orbit, power, comms, instruments and rocket.</p></div>
          <div class="row"><button class="btn ghost" data-act="go" data-v="scen">← Mission selection</button><button class="btn go" data-act="go" data-v="design">Start mission →</button></div>
        </div>
      </div>
    </section>`;
  },

  design: () => {
    const d = S.d, s = SCEN[d.scen], r = compute(d), o = r.o;
    const sec = (key, title, body, help) => `<div class="card"><h3>${title}${owner(key)}</h3>${help ? `<p class="mut">${help}</p>` : ""}<div class="grid">${body}</div></div>`;
    return `<div class="layout"><div>
      <div class="card"><h2>${s.name}</h2><p>${s.goal}</p><p class="mut">Budget <b>$${s.budget}M</b> · Science target <b>${s.target.sci}</b> · Lifetime target <b>${s.target.years} years</b></p></div>
      ${sec("orbit", "1. Orbit", s.orbits.map(x => card("orbit", x, d.orbit === x.id)).join(""), "Δv is the speed change your spacecraft must make itself with its own fuel once the rocket drops it off.")}
      ${PART_KEYS.map((k, i) => sec(k, `${i + 2}. ${PARTS[k].label}`, PARTS[k].opts.map(x => card(k, x, d[k] === x.id)).join(""))).join("")}
      ${sec("inst", "8. Science instruments (pick any)", INST.map(x => card("inst", x, d.inst.includes(x.id))).join(""), `Science points depend on the target: an instrument great at Jupiter may be weak at Earth. Value here: ${INST.map(i => `${i.name.split(" ")[0]} ${Math.round(i.sci * i.fit[d.scen])}`).join(", ")}.`)}
      ${sec("launch", "9. Launch vehicle", LV.map(x => card("launch", x, d.launch === x.id, o.cap)).join(""))}
      <div class="row"><button class="btn ghost" data-act="go" data-v="scen">← Change mission</button><button class="btn ghost" data-act="share">Copy share link</button><button class="btn" data-act="go" data-v="review">Launch readiness review →</button></div>
    </div>
    <div class="dash card"><h3>Mission dashboard</h3>
      ${bar("Mass vs rocket limit", r.wet, r.cap, v => fmt(v) + " kg")}
      <small class="mut">Dry ${fmt(r.dry)} kg + fuel ${fmt(r.prop)} kg</small>
      ${bar("Power used vs made", r.use, r.gen, v => fmt(v) + " W")}
      ${bar("Cost vs budget", r.cost, s.budget, v => "$" + fmt(v) + "M")}
      <small class="mut">Includes $${s.ops * s.target.years}M operations</small>
      ${bar("Data vs downlink", r.data, r.link, v => v.toFixed(1) + " Gb")}
      ${bar("Lifetime", r.life, s.target.years, v => v.toFixed(1) + " yr", true)}

      <p class="mut" style="font-size:.85rem">${tip(d, r)}</p>
    </div></div>`;
  },

  review: () => {
    const d = S.d, s = SCEN[d.scen], r = compute(d);
    const blockers = [], warns = [];
    if (!d.inst.length) blockers.push("No science instruments. A mission needs at least one!");
    if (!r.cap) blockers.push(`The ${r.lv.name.toLowerCase()} can't reach ${s.where}. Pick a bigger rocket.`);
    else if (r.wet > r.cap) blockers.push(`Too heavy: ${fmt(r.wet)} kg, but the rocket can only lift ${fmt(r.cap)} kg there. Remove mass or use a bigger rocket. Remember, every extra kg also needs extra fuel.`);
    if (r.cost > s.budget) blockers.push(`Over budget: $${fmt(r.cost)}M vs $${s.budget}M. The review board will not approve this.`);
    explain(d, r).filter(x => x[0] !== "ok").forEach(x => warns.push(x[1]));
    return `<div class="card"><h2>‍Launch readiness review</h2>
      ${blockers.length ? `<h3 >Not ready to launch</h3><ul class="chk">${blockers.map(b => `<li>${mark("bad")}${b}</li>`).join("")}</ul>` : `<h3 >Cleared for launch</h3>`}
      ${warns.length ? `<h3 class="mut">Risks the review board noticed</h3><ul class="chk">${warns.map(w => `<li>${mark("warn")}${w}</li>`).join("")}</ul>` : ""}

  },

  launch: () => `<div class="card" style="text-align:center;min-height:480px;overflow:hidden"><h2>T-0: Liftoff!</h2><div style="margin-top:300px"><span class="ship"></span></div><p class="mut">Cruising to ${SCEN[S.d.scen].where}...</p></div>`,

  ops: () => {

          <div><em>Destination</em><b>${s.where}</b></div>
          <div><em>Mission progress · month ${months} of ${total}</em>${meter(resolved / n)}<div class="cprog"><span>Event ${S.ei + 1} of ${n}</span><span>${Math.round(resolved / n * 100)}% complete</span></div></div>
          <div><em>Operation status</em><b style="color:${S.out ? "var(--blue)" : "var(--orange)"}">${S.out ? "Nominal" : "Alert"}</b></div>
        </div>

        <article class="bpanel cview m-${k} rise" style="--i:2">
          <div class="bvis"><span class="planet" aria-hidden="true"></span>${pic(planetImg(k), `${w.n}, NASA photograph`, "medium")}
            <span class="corbit" aria-hidden="true"><i></i></span>
            <span class="chud tl">Destination<b>${w.n}</b></span>
            <span class="chud tr">Downlink<b>${r.link.toFixed(1)} Gb/day</b></span>

            <div class="cstat${sci < s.target.sci ? " warn" : ""}"><em>Science points</em><b>${fmt(sci)}</b><small>projected · target ${s.target.sci}</small>${meter(sci / s.target.sci, sci < s.target.sci)}</div>
            <div class="cstat"><em>Mission time</em><b>Month ${months}</b><small>of ${total} planned</small>${meter(months / total)}</div>
            <div class="cstat${life < s.target.years ? " warn" : ""}"><em>Lifetime</em><b>${life.toFixed(1)} yrs</b><small>projected · target ${s.target.years}</small>${meter(life / s.target.years, life < s.target.years)}</div>
          </div>
          <div class="cmini">
            <div class="${r.duty < 1 ? "warn" : ""}"><em>Power</em>${fmt(r.gen)} / ${fmt(r.use)} W</div>
            <div class="${r.linkF < 1 ? "warn" : ""}"><em>Data sent</em>${pct(r.linkF)}</div>
            <div><em>Fuel loaded</em>${fmt(r.prop)} kg</div>
          </div>
        </article>
        <article class="bpanel rise" style="--i:4">
          <div class="bh">Mission <b>objectives</b></div>

        </article>
        </div>

        <div class="bpanel wide rise" style="--i:4">
          <div class="bh">Mission <b>actions</b></div>
          ${S.players > 1 ? `<p class="badge clead">Decision lead: ${esc(S.names[3 % S.players])} (Comms &amp; Ops). Discuss with the team!</p>` : ""}

              <button class="btn go" data-act="next">${last ? "View mission report →" : "Continue mission →"}</button></div>`
          : `<div class="cacts">${["a", "b"].map(c => `
              <button class="cact ${c}" data-act="choose" data-v="${c}">
                <span class="mtop"><span>Option ${c.toUpperCase()}</span></span>
                <strong>${ev[c]}</strong>
                <span class="ccons t-${opt(c)[0]}"><i>${{ safe: "Safe", trade: "Trade-off", risk: "Risky" }[opt(c)[0]]}</i>${opt(c)[1]}</span>
                <span class="mcta">Execute <span aria-hidden="true">→</span></span>
              </button>`).join("")}</div>`}
        </div>

        <div class="bpanel wide rise" id="c-log" style="--i:5">
          <div class="bh">Mission <b>progress</b></div>
          <div class="cprogress">
            <div><div class="bsub" style="margin-top:0">Operations events · ${resolved} completed · ${n - resolved} remaining</div>
              <ol class="ctl">${S.events.map((x, i) => i < S.ei || (i === S.ei && S.out)
                ? `<li class="done"><span>✓</span><div><b>${x.title}</b>${e.log[i] ? e.log[i][1] : ""}</div></li>`
                : i === S.ei ? `<li class="now"><span>0${i + 1}</span><div><b>${x.title}</b>Awaiting your decision.</div></li>`
                : `<li><span>0${i + 1}</span><div><b>Upcoming event</b>Unknown until it happens.</div></li>`).join("")}</ol></div>
            <div class="cbig"><div class="bsub" style="margin-top:0">Current progress</div>
              <b>${Math.round(resolved / n * 100)}<small>%</small></b>${meter(resolved / n)}
              <p>${resolved} of ${n} events resolved · month ${months} of ${total}.${resolved === n ? " Operations complete, the report is next." : ` ${n - resolved} still ahead.`}</p></div>
          </div>
        </div>

        <nav class="bpanel wide cnav rise" aria-label="Mission control" style="--i:6">
          <button class="btn ghost" data-act="jump" data-v="c-status">Mission overview</button>
          <div class="row">
            <button class="btn ghost" data-act="jump" data-v="c-log"${S.ei || S.out ? "" : " disabled"}>← Previous step</button>
            <button class="btn" ${S.out ? `data-act="next"` : "disabled"}>${S.out ? (last ? "Mission report →" : "Continue mission →") : "Decide to continue"}</button>
          </div>
        </nav>
      </div>
    </section>`;
  },

  report: () => {
    const d = S.d, s = SCEN[d.scen], r = finish(d, compute(d));
    const col = r.result === "FULL SUCCESS" ? "#fff" : "var(--mut)";
    saveScore(r.score);
    return `<div class="card" style="text-align:center"><p class="mut">${s.name} · Mission report${S.team ? " · " + esc(S.team) : ""}</p>
      <div class="big" style="color:${col}">${r.result}</div><div class="big">${fmt(r.score)} pts</div>
      <p>Science ${fmt(r.sciFinal)} / ${s.target.sci} (${pct(r.sciR)}) · Lifetime ${r.lifeFinal.toFixed(1)} / ${s.target.years} yr · Cost $${fmt(r.cost)}M / $${s.budget}M</p></div>
      <div class="card"><h3>Why it went this way</h3><ul class="chk">${explain(d, r).map(x => `<li>${mark(x[0])}${x[1]}</li>`).join("")}</ul></div>
      <div class="card"><h3>What happened in operations</h3><ul class="chk">${d.ev.log.map(l => `<li>${mark("")}<b>${l[0]}</b>: ${l[1]}</li>`).join("")}</ul></div>
      <div class="card"><h3>Team goals (+50 each)</h3><ul class="chk">${ROLES.map((g, i) => `<li>${mark(r.goals[i] ? "ok" : "bad")}${g.name}${S.players > 1 ? " (" + esc(S.names[i % S.players]) + ")" : ""}: ${g.goal}</li>`).join("")}</ul></div>
      <div class="card"><h3>Compare with a real NASA mission</h3><p>${s.real}</p><p class="mut">Your spacecraft: ${fmt(r.wet)} kg at launch, ${fmt(r.gen)} W of power at ${s.where}.</p></div>
      <div class="card"><h3>Best missions on this device (${s.name})</h3><table>${board(d.scen).map((b, i) => `<tr><td>${i + 1}</td><td>${esc(b.n)}</td><td>${fmt(b.s)} pts</td></tr>`).join("") || "<tr><td>No scores yet</td></tr>"}</table></div>
      <div class="row"><button class="btn" data-act="retry">Change the design and fly again</button><button class="btn ghost" data-act="share">Share this design</button><button class="btn ghost" data-act="go" data-v="scen">New mission</button></div>`;
  }
};

const mark = m => `<span class="mk ${m}">${m === "ok" ? "✓" : m === "bad" ? "✕" : m === "warn" ? "!" : "·"}</span>`;
function tip(d, r) {
  if (!d.inst.length) return "Start by adding instruments. They are why the mission exists.";
  if (r.cap && r.wet > r.cap) return "Too heavy for this rocket. Fuel grows with mass, so dropping 10 kg of hardware saves even more.";
  if (r.gen < r.use) return "Not enough power, so instruments will only run part of the time.";
  if (r.data > r.link) return "You collect more data than you can send home. The rest is lost.";
  if (r.radExcess > 0) return "Radiation will shorten your mission. Shielding or a hardened computer helps.";
  return "Looking good! Try the launch readiness review.";
}

function explain(d, r) {
  const s = r.s, out = [];
  if (r.cap) out.push([r.wet <= r.cap ? "ok" : "bad", `Mass: ${fmt(r.wet)} kg including ${fmt(r.prop)} kg of fuel for a ${r.o.dv} km/s burn (rocket equation). Rocket limit: ${fmt(r.cap)} kg.`]);
  const sunPct = Math.round(s.irr / EARTH_SUN * 100);
  out.push([r.duty >= 1 ? "ok" : "warn", `Power: ${fmt(r.gen)} W made vs ${fmt(r.use)} W needed.` + (OPT[d.power].solar && sunPct < 100 ? ` At ${s.where} sunlight is only ${sunPct}% as strong as at Earth (NASA Planetary Fact Sheet).` : "") + (r.duty < 1 ? ` Instruments can only run ${pct(r.duty)} of the time.` : "")]);
  if (r.battNeed) out.push([r.battF === 1 ? "ok" : "warn", r.battF === 1 ? "Battery: big enough to get through each pass in the planet's shadow." : `Battery: too small for the shadow passes (needs about ${fmt(r.battNeed)} Wh). You lose 20% of observations.`]);
  out.push([r.linkF >= 1 ? "ok" : "warn", `Data: instruments make ${r.data.toFixed(1)} Gb/day, your link sends ${r.link.toFixed(1)} Gb/day.` + (r.linkF < 1 ? ` Only ${pct(r.linkF)} of the data gets home. A farther target means a weaker signal.` : "")]);
  if (r.pointF < 1) out.push(["warn", "Pointing: cameras and spectrometers need precise pointing. Basic wheels cost you 15% of their quality."]);
  if (s.rad + r.o.rad > 0) out.push([r.radExcess ? "warn" : "ok", r.radExcess ? `Radiation: not enough protection, so electronics wear out early (lifetime ×${r.lifeF.toFixed(2)}).` : "Radiation: your shielding and electronics can handle this environment."]);
  out.push([r.life >= s.target.years ? "ok" : "warn", `Lifetime: expected ${r.life.toFixed(1)} years vs ${s.target.years}-year goal.`]);
  out.push([r.sci >= s.target.sci ? "ok" : "warn", `Science: ${fmt(r.sci)} expected vs target ${s.target.sci}. Orbit coverage ×${r.o.cov}.`]);
  out.push([r.cost <= s.budget ? "ok" : "bad", `Budget: $${fmt(r.cost)}M of $${s.budget}M.`]);
  return out;
}

// ---------- Leaderboard & sharing ----------
function board(scen) { try { return JSON.parse(localStorage.getItem("ma-board-" + scen) || "[]"); } catch { return []; } }
function saveScore(score) {
  if (S.saved) return; S.saved = true;
  try { const b = board(S.d.scen); b.push({ n: S.team || S.names[0], s: score }); b.sort((x, y) => y.s - x.s); localStorage.setItem("ma-board-" + S.d.scen, JSON.stringify(b.slice(0, 5))); } catch {}
}
function share() {
  const { ev, ...design } = S.d;
  const url = location.href.split("#")[0] + "#" + btoa(JSON.stringify(design));
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => alert("Share link copied!"), () => prompt("Copy this link:", url));
}

// ---------- Actions ----------
const ACT = {
  go: v => { S.screen = v; },
  jump: v => { document.getElementById(v)?.scrollIntoView({ behavior: "smooth" }); return false; },
  players: v => { S.players = +v; },
  scen: v => { S.d = newDesign(v); S.screen = "brief"; },
  pick: (v, k) => {
    if (k === "inst") { const a = S.d.inst; a.includes(v) ? a.splice(a.indexOf(v), 1) : a.push(v); }
    else S.d[k] = v;
  },
  share: () => { share(); return false; },
  launch: () => {
    const r = compute(S.d);
    S.d.ev = { sci: 1, life: 1, cost: 0, log: [] };
    S.events = EVENTS.filter(e => !e.when || e.when(S.d, r)).sort(() => Math.random() - 0.5).slice(0, 3);
    S.ei = 0; S.out = null; S.saved = false; S.screen = "launch";
    setTimeout(() => { S.screen = "ops"; render(); }, 2800);
  },
  choose: v => { const ev = S.events[S.ei]; S.chosen = v; S.out = ev.run(S.d, compute(S.d), v); S.d.ev.log.push([ev.title, S.out]); },
  next: () => { S.out = null; if (++S.ei >= S.events.length) S.screen = "report"; },
  retry: () => { S.screen = "design"; }
};

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const y = window.scrollY;
  if (ACT[b.dataset.act](b.dataset.v, b.dataset.k) === false) return;
  render();
  if (b.dataset.act === "pick") window.scrollTo(0, y); else window.scrollTo(0, 0);
});
document.addEventListener("input", e => {
  if (e.target.id === "team") S.team = e.target.value;
  if (e.target.dataset.name) S.names[+e.target.dataset.name] = e.target.value || "Player " + (+e.target.dataset.name + 1);
});

// Scroll reveal on the landing page (content stays visible where IntersectionObserver is missing)
const io = window.IntersectionObserver ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px" }) : null;
if (io) document.documentElement.classList.add("js-reveal");
function render() { $app.innerHTML = SCREENS[S.screen](); if (io) $app.querySelectorAll(".reveal").forEach(el => io.observe(el)); }

// Load a shared design from the URL, if any
// Only accept IDs that exist; anything unknown falls back to the default design
try {
  if (location.hash.length > 1) {
    const d = JSON.parse(atob(location.hash.slice(1)));
    if (Object.hasOwn(SCEN, d.scen)) {
      const base = newDesign(d.scen), has = (list, id) => list.some(x => x.id === id);
      if (has(SCEN[d.scen].orbits, d.orbit)) base.orbit = d.orbit;
      PART_KEYS.forEach(k => { if (has(PARTS[k].opts, d[k])) base[k] = d[k]; });
      if (has(LV, d.launch)) base.launch = d.launch;
      if (Array.isArray(d.inst)) base.inst = [...new Set(d.inst.filter(i => has(INST, i)))];
      S.d = base; S.screen = "design";
    }
  }
} catch {}
render();
loadApod();
</script>
</body>
</html>
